services:
  workbench:
    environment:
      ZHICAI_PUBLIC_ORIGIN: https://${ZHICAI_PUBLIC_IP:?Set the public IP}

  public_gateway:
    image: public.ecr.aws/docker/library/caddy:2.11.6-alpine@sha256:d44355d3c2149dc580ce2cac735955d1c08d3d00882c30489c241aa51a5c10d9
    init: true
    network_mode: host
    restart: unless-stopped
    depends_on:
      - workbench
    environment:
      ZHICAI_PUBLIC_IP: ${ZHICAI_PUBLIC_IP:?Set the public IP}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ${ZHICAI_CADDY_DATA_DIR:?Set Caddy data directory}:/data
      - ${ZHICAI_CADDY_CONFIG_DIR:?Set Caddy config directory}:/config

