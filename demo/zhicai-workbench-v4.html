 trend:{title:'关键词每日趋势',platform:'xhs',source:'聚光',icon:'file',kind:'keywords',dates:true,unit:'关键词',label:'输入关键词',desc:'批量获取指定日期的搜索趋势明细，保留平台指标口径。',input:'关键词 + 日期',output:'关键词、日期、搜索量',sample:'防晒\n敏感肌防晒\n通勤防晒',columns:[['keyword','关键词'],['date','统计日期'],['value','搜索量',1],['status','状态']]},

function generateRows(id,c,item,index){const h=hash(item+id),status='成功';if(id==='trend'||id==='baidu')return days(c.start,c.end).map((date,i)=>({keyword:item,date,value:800+(h+i*973)%58000,status}));if(id==='keywords')return Array.from({length:c.limit},(_,i)=>({root:item,keyword:item+['推荐','测评','怎么选','方法','入门','清单','攻略','体验','原理','避坑'][i%10]+(i>=10?' '+(Math.floor(i/10)+1):''),index:Math.max(300,56000-(h%9000)-i*1700),rank:i+1,status}));if(id==='notes')return [{title:['通勤防晒记录','敏感肌护肤清单','户外装备整理'][index%3]+'（模拟）',author:'示例作者 '+String.fromCharCode(65+index%26),body:'这是用于说明输出字段的本地模拟正文，未获取真实笔记内容。',cover:`https://example.com/demo-cover/${h}.jpg`,url:item,status}];if(id==='industry')return [{brand:item,period:c.start+' ~ '+c.end,search:2000+h%63000,interaction:1000+(h*3)%43000,content:500+h%12000,status}];if(id==='douyin')return days(c.start,c.end).map((date,i)=>({keyword:item,date,search:2000+(h+i*897)%43000,total:6000+(h+i*768)%89000,status}));if(id==='product')return days(c.start,c.end).flatMap((date,i)=>['手淘搜索','推荐流量'].map((source,j)=>({item,date,source,visitors:150+(h+i*117+j*192)%2500,cart:20+(h+i*3+j*7)%120,status})));return ['全部来源 > 站内 > 搜索','全部来源 > 站内 > 推荐'].map((source,j)=>({shop:item,period:c.start+' ~ '+c.end,source,visitors:`${1000+(h+j*271)%3000} ~ ${5000+(h+j*271)%3000}`,status}))}
function validate(c,id){const errors=[],p=inputItems(c,id);if(!p.valid.length)errors.push('请至少输入一个有效项目。');if(p.invalid.length)errors.push(`第 ${p.invalid.join('、')} 行格式不正确，请修正后提交。`);if(p.valid.length>50)errors.push('演示版每次最多处理 50 个输入项。');if(tools[id].dates){const n=countDays(c.start,c.end);if(!Number.isFinite(n)||n<1||n>90||c.end>today())errors.push('请选择有效日期范围（最多 90 天，不能晚于今天）。')}return errors}

function launchRun(id,c,items=null,parent=null){

function stopRun(){const r=runForTool();if(!r||r.status!=='running'||r.owner!==currentUser)return;r.status='stopped';r.reason='用户已停止模拟任务，已生成的结果已保留。';clearInterval(timer);persist();renderTool();toast('任务已停止。')}

function downloadRun(r,failed=false){
 if(!r||!canResult(r))return toast('无权访问该结果。','lock');

}
function parseCSV(text){text=text.replace(/^﻿/,'');const rows=[];let row=[],cell='',quoted=false;for(let i=0;i<text.length;i++){const c=text[i];if(c==='"'){if(quoted&&text[i+1]==='"'){cell+='"';i++}else quoted=!quoted}else if(c===','&&!quoted){row.push(cell);cell=''}else if((c==='\n'||c==='\r')&&!quoted){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cell);rows.push(row);row=[];cell=''}else cell+=c}if(quoted)throw new Error('文件引号未闭合，请使用模板重新导出。');if(cell||row.length){row.push(cell);rows.push(row)}return rows.filter(r=>r.some(c=>c.trim()))}
async function importFile(file){if(!file)return;const id=currentTool;if(!/\.(csv|txt)$/i.test(file.name))return toast('仅支持 UTF-8 编码的 CSV 或 TXT 文件。','alert');if(file.size>2*1024*1024)return toast('文件不能超过 2 MB。','alert');try{const text=(await file.text()).replace(/^﻿/,'');if(text.includes('�'))throw new Error('请将文件另存为 UTF-8 编码后导入。');let vals;if(/\.csv$/i.test(file.name)){const rows=parseCSV(text);if(rows.some(r=>r.length!==1))throw new Error('请使用单列 CSV 模板，或将目标列复制到输入框。');vals=rows.map(r=>r[0].trim());if(['输入项','keyword','url','item_id','shop_id','input','关键词','链接','商品ID'].includes(vals[0]))vals.shift()}else vals=text.split(/\r?\n/).map(v=>v.trim()).filter(Boolean);if(!vals.length)throw new Error('文件没有可导入的输入项。');if(vals.join('\n').length>30000)throw new Error('输入内容过长，请拆分后导入。');if(page!=='tool'||currentTool!==id)return toast('工具已切换，未替换当前输入。','info');const apply=()=>{configs[id].input=vals.join('\n');configs[id].fileName=file.name;configErrors=[];renderConfig();renderResult();toast('已导入 '+vals.length+' 行，请检查输入识别结果。')};if(configs[id].input.trim())showModal('替换当前输入？',`将使用 <strong>${esc(file.name)}</strong> 中的 ${vals.length} 行内容，替换当前文本框。不会与原输入合并。`, '替换输入',apply);else apply()}catch(e){toast(e.message||'文件解析失败。','alert')}}

/* ---------- Account-bound access: these are UX simulations, not security enforcement. ---------- */
function canManageAccount(a){return !!a&&(isAdmin()||a.owner===currentUser);}
function canManageAnyAccount(){return isAdmin()||accounts.some(a=>a.owner===currentUser);}

function assignedAccounts(tool,who=currentUser){
 const u=users.find(u=>u.id===who);if(!u||!can(tool,who))return [];
 return accounts.filter(a=>a.service===serviceFor(tool)&&(u.bindings?.[tool]||[]).includes(a.id));
}
function hasAnyAccountAccess(tool,who=currentUser){return can(tool,who)&&assignedAccounts(tool,who).length>0;}
function canResult(r){return !!r&&r.owner===currentUser&&can(r.tool)&&assignedAccounts(r.tool).some(a=>a.id===r.accountId);}
function hasRunnableAccount(tool){return can(tool)&&assignedAccounts(tool).some(a=>a.status==='verified');}
function toolAccessLabel(tool){
 if(!can(tool))return I('lock','i14')+' 无访问权限';
 if(!assignedAccounts(tool).length)return I('alert','i14')+' 未分配账号';
 if(!hasRunnableAccount(tool))return '<span class="dot" style="color:var(--amber)"></span> 账号待连接';
 return '<span class="dot" style="color:var(--green)"></span> 可采集';
}
function ensureAccount(tool){const c=configs[tool],list=assignedAccounts(tool);if(!list.some(a=>a.id===c.accountId))c.accountId=(list.find(a=>a.status==='verified')||list[0])?.id||'';}
function runBlockReason(tool,c,who=currentUser){
 if(!can(tool,who))return '当前成员的工具访问权限未授权或已到期。';
 const a=accounts.find(a=>a.id===c.accountId);
 if(!a||a.service!==serviceFor(tool))return '请先分配并选择适用于当前工具的平台账号。';
 if(!assignedAccounts(tool,who).some(x=>x.id===a.id))return '当前成员未获授权使用该平台账号。';
 if(a.status==='disabled')return '该账号已停用，请选择其他已授权账号。';
 if(a.status==='expired')return '该账号登录已失效，请联系账号负责人更新连接。';
 if(a.status!=='verified')return '该账号尚未通过模拟验证，请先配置并验证连接。';
 return '';
}
const accountStatuses={verified:['green','已验证'],unverified:['amber','未验证'],expired:['red','登录失效'],disabled:['','已停用']};
function connectionPill(a){

}

 <div class="account-bound-note">${I('lock','i14')}账号凭据不向普通使用者展示</div></div>`;

function credentialMarkup(){

 if(a.method==='login')return `<div class="credential-box login-box"><div class="login-explanation"><span class="browser-connection-icon">${I('terminal')}</span><div><h3>在受控浏览器中完成账号登录</h3><p>账密用于辅助登录，登录成功后由执行端复用会话采集。</p></div></div>
 <div class="login-route" role="group" aria-label="账号登录辅助方式"><label><input type="radio" name="login-route" value="manual" ${a.loginMode!=='password'?'checked':''}>手动登录 / 扫码</label><label><input type="radio" name="login-route" value="password" ${a.loginMode==='password'?'checked':''}>账密辅助登录</label></div>
 ${a.loginMode==='password'?`<div class="login-password-fields"><div class="between"><span class="small muted">账密 → 浏览器登录 → 建立会话</span><button class="text-btn" data-action="fill-credential-demo">填入虚构示例</button></div><div class="field"><div class="field-label"><label for="demo-login">登录账号</label></div><input id="demo-login" class="secret-input" maxlength="120" autocomplete="off" spellcheck="false" placeholder="仅输入虚构账号，如 demo-user"></div><div class="field"><div class="field-label"><label for="demo-password">登录密码</label></div><input id="demo-password" class="secret-input" type="password" maxlength="200" autocomplete="new-password" placeholder="仅输入虚构密码，不会保存"></div><p class="login-help">正式接入时，需适配平台登录流程；遇到验证码或二次验证由负责人完成。</p></div>`:`<p class="login-help manual-help">正式接入后，在受控浏览器中扫码或手动完成验证。本页不打开真实登录窗口，也不会读取当前浏览器的登录状态。</p>`}
 <div class="login-complete"><span class="pill ${a.loginDemoDone?'green':existing?'blue':''}">${a.loginDemoDone?'已建立模拟登录会话':existing?'已有模拟登录会话':'尚未建立会话'}</span><button class="btn primary sm" data-action="simulate-account-login">${I('play','i14')}${a.loginMode==='password'?'模拟账密登录':'模拟完成登录'}</button></div>
 <div class="credential-storage-note">${I('lock','i14')}输入内容仅在当前表单中临时存在，不保存原始账密。</div></div>`;
 return `<div class="credential-box"><div class="between"><h3>导入已有会话（演示）</h3><button class="text-btn" data-action="fill-credential-demo">填入虚构示例</button></div><div class="field"><div class="field-label"><label for="cookie-format">输入格式</label></div><select id="cookie-format"><option value="cookie">Cookie 文本（name=value）</option><option value="state">浏览器会话 JSON（示例结构）</option></select></div><div class="field"><div class="field-label"><label for="demo-cookie">Cookie / 会话内容</label><button class="text-btn" data-action="import-credential">${I('upload','i14')}导入示例文件</button></div><textarea id="demo-cookie" class="secret-input" maxlength="200000" rows="4" spellcheck="false" autocomplete="off" autocorrect="off" autocapitalize="off" placeholder="${existing?'已有“已配置”标记，原始内容不会回显。留空不更新。':'仅粘贴虚构文本；可点击“填入虚构示例”。'}"></textarea><input type="file" id="credential-file" accept=".txt,.json" class="hidden" aria-label="选择虚构会话示例文件"></div><div class="credential-storage-note">${I('lock','i14')}保存或关闭后清空输入，仅保留“已配置”标记。</div></div>`;
}
function simulateAccountLogin(){
 const a=accountDraft;if(!a||a.method!=='login')return;
 if(a.loginMode==='password'){
  const login=$('#demo-login')?.value.trim(),password=$('#demo-password')?.value;
  if(!login||!password){$('#account-errors').textContent='请先填写虚构账号和密码，或点击“填入虚构示例”。';$('#account-errors').classList.remove('hidden');$('#account-errors').scrollIntoView({block:'nearest'});return;}
 }
 a.loginDemoDone=true;a.credsTouched=true;accountFormDirty=true;
 scrubCredentialInputs();$('#credential-area').innerHTML=credentialMarkup();$('#account-errors').classList.add('hidden');
 toast('已模拟建立登录会话，原始输入已清空。不会登录真实平台。');
}
function scrubCredentialInputs(){$$('.secret-input').forEach(el=>el.value='');const f=$('#credential-file');if(f)f.value='';}
function closeAccountEditor(force=false){
 if(!force&&accountFormDirty){showModal('放弃账号配置修改？','未保存的配置和凭据输入会被清空，不会保存到浏览器。','放弃修改',()=>closeAccountEditor(true));return;}
 scrubCredentialInputs();$('#account-drawer').close();$('#account-drawer-content').innerHTML='';accountDraft=null;accountFormDirty=false;
 if(accountReturn?.isConnected)accountReturn.focus();

function saveAccount(){
 const a=accountDraft;if(!a)return;const old=a.id?accounts.find(x=>x.id===a.id):null;
 if(old?!canManageAccount(old):!isAdmin())return toast('无权保存该账号。','lock');
 const errors=[];
 if(!a.alias.trim())errors.push('请填写账号别名。');
 if(accounts.some(x=>x.id!==a.id&&x.service===a.service&&x.alias===a.alias.trim()))errors.push('同一服务下已存在相同账号别名。');
 if(!users.some(u=>u.id===a.owner))errors.push('请选择有效的账号负责人。');
 let configured=a.credentialConfigured,newCredential=!!a.loginDemoDone;
 if(a.method==='cookie'){
  const raw=$('#demo-cookie')?.value.trim()||'';
  if(raw){try{if($('#cookie-format').value==='state'){const state=JSON.parse(raw);if(!Array.isArray(state.cookies))throw new Error('format');}else if(!raw.includes('='))throw new Error('format');newCredential=true;}catch(e){errors.push('请使用所选格式的虚构示例：Cookie 需含 name=value；会话 JSON 需含 cookies 数组。');}}
 }else if(a.loginMode==='password'&&($('#demo-login')?.value||$('#demo-password')?.value))errors.push('账密仅是登录输入，请先点击“模拟账密登录”建立会话，再保存配置。');
 if(newCredential)configured=true;
 if(old?.status==='expired'&&!newCredential)errors.push('登录已失效，请重新模拟登录或导入新的虚构会话。');
 if(!configured)errors.push(a.method==='login'?'请先完成一次模拟登录。':'请先填写虚构会话，或点击“填入虚构示例”。');
 if(old&&runs.some(r=>r.accountId===a.id&&r.status==='running'))errors.push('该账号正在运行任务，暂不能修改连接。');
 if(errors.length){$('#account-errors').innerHTML=errors.map(esc).join('<br>');$('#account-errors').classList.remove('hidden');$('#account-errors').scrollIntoView({block:'nearest'});return;}
 const changed=!old||newCredential||old.method!==a.method;
 const saved=accountRecord({...a,id:a.id||'acc-'+uid(),alias:a.alias.trim(),credentialConfigured:configured,status:old?.status==='disabled'?'disabled':changed?'unverified':old.status,revision:(old?.revision||0)+(changed?1:0),updated:Date.now(),verifiedAt:changed?0:(old?.verifiedAt||0),lastEvent:changed?'已保存演示连接，等待模拟验证':'已更新账号基本信息'});
 if(old)accounts[accounts.findIndex(x=>x.id===old.id)]=saved;else accounts.push(saved);
 users.forEach(cleanBindings);if(editor)cleanBindings(editor);
 persist();closeAccountEditor(true);repaintAccountContext();
 toast(!old?'账号已保存，请模拟验证并在权限页分配给成员。':changed?'连接已更新，需重新模拟验证。':'账号信息已更新。');
}
function verifyAccount(id){
 const a=accounts.find(a=>a.id===id);if(!canManageAccount(a))return toast('只有管理员或账号负责人可以验证连接。','lock');
 if(a.status==='disabled')return toast('账号已停用，请先启用。','info');
 if(a.status==='expired'){toast('请先更新演示连接，再进行模拟验证。','info');return openAccountEditor(id);}
 if(!a.credentialConfigured)return openAccountEditor(id);
 if(verificationTimers.has(id))return;
 if(runs.some(r=>r.accountId===id&&r.status==='running'))return toast('账号正在执行任务，暂不验证。','info');
 const revision=a.revision,who=currentUser;
 const handle=setTimeout(()=>{
  verificationTimers.delete(id);
  const latest=accounts.find(x=>x.id===id);
  if(!latest||latest.revision!==revision||latest.status==='disabled')return repaintAccountContext();
  latest.status='verified';latest.verifiedAt=Date.now();latest.updated=Date.now();latest.lastEvent='模拟验证通过：演示连接可用';
  persist();repaintAccountContext();if(currentUser===who)toast('模拟验证通过。未连接真实平台，未校验真实账号。');
 },850);
 verificationTimers.set(id,handle);repaintAccountContext();
}
function toggleAccount(id){
 const a=accounts.find(a=>a.id===id);if(!canManageAccount(a))return;
 const enable=a.status==='disabled';
 showModal(enable?'启用此平台账号？':'停用此平台账号？',enable?
 `启用 <strong>${esc(a.alias)}</strong> 后状态回到“未验证”，需重新模拟验证才能采集。原有成员授权保留。`:
 `停用 <strong>${esc(a.alias)}</strong> 后禁止新采集，使用它的模拟任务会停止。账号和历史结果不会删除，已有结果仍按当前授权访问。`,
 enable?'启用账号':'确认停用',()=>{
  if(!canManageAccount(a))return;
  if(verificationTimers.has(id)){clearTimeout(verificationTimers.get(id));verificationTimers.delete(id);}
  a.status=enable?'unverified':'disabled';a.revision++;a.updated=Date.now();a.lastEvent=enable?'账号已启用，等待模拟验证':'负责人已停用账号';
  if(!enable)runs.filter(r=>r.accountId===id&&r.status==='running').forEach(r=>{r.status='stopped';r.reason='平台账号已停用，任务停止，已生成的结果保留。';clearInterval(timer)});
  persist();repaintAccountContext();toast(enable?'已启用，请重新模拟验证。':'账号已停用。');
 });
}

 <div class="notice" style="margin-top:14px">${I('shield')}<span>账号选择将在保存权限后生效。取消账号选择，会同时关闭该成员对该账号已有结果的访问。</span></div>`;

async function importCredentialFile(file){
 if(!file||!accountDraft)return;
 if(!/\.(txt|json)$/i.test(file.name)||file.size>200000)return toast('仅支持不超过 200 KB 的 TXT / JSON 虚构示例。','alert');
 const draft=accountDraft;
 try{const text=await file.text();if(accountDraft!==draft||accountDraft.method!=='cookie')return;

 $('#demo-cookie').value=text;accountDraft.credsTouched=true;accountFormDirty=true;
 $('#account-errors')?.classList.add('hidden');
 }catch(e){toast('未能读取示例文件。','alert')}
}

Object.assign(clickActions,{

  else if(accountDraft.loginMode==='password'){$('#demo-login').value='demo-user';$('#demo-password').value='FICTIONAL_PASSWORD_ONLY';accountDraft.loginDemoDone=false;}

 },

document.addEventListener('click',ev=>{
 const el=ev.target.closest('button');if(!el||el.disabled)return;
 if(el.dataset.accountPlatform){accountPlatform=el.dataset.accountPlatform;renderAccounts();}
 if(el.dataset.editAccount)openAccountEditor(el.dataset.editAccount);
 if(el.dataset.verifyAccount)verifyAccount(el.dataset.verifyAccount);
 if(el.dataset.toggleAccount)toggleAccount(el.dataset.toggleAccount);
 if(el.dataset.bindTool){openBindingEditor(el.dataset.bindTool);updateBindingDialog();}
 if(el.dataset.connectionMethod&&accountDraft){
  if(accountDraft.method===el.dataset.connectionMethod)return;
  scrubCredentialInputs();accountDraft.method=el.dataset.connectionMethod;accountDraft.credentialConfigured=false;accountDraft.loginDemoDone=false;accountDraft.credsTouched=true;accountFormDirty=true;
  $$('.method-option').forEach(b=>{b.classList.toggle('active',b===el);b.setAttribute('aria-pressed',String(b===el));});$('#credential-area').innerHTML=credentialMarkup();$('#account-errors')?.classList.add('hidden');
 }
});
document.addEventListener('input',ev=>{
 const el=ev.target;
 if(el.id==='account-search'){accountQuery=el.value;const pos=el.selectionStart;renderAccounts();$('#account-search').focus();try{$('#account-search').setSelectionRange(pos,pos);}catch(e){}return;}
 if(!accountDraft)return;
 if(el.dataset.accountField){accountDraft[el.dataset.accountField]=el.value;accountFormDirty=true;}
 if(el.classList.contains('secret-input')){accountDraft.credsTouched=true;accountDraft.loginDemoDone=false;accountFormDirty=true;}
 $('#account-errors')?.classList.add('hidden');
});
document.addEventListener('change',ev=>{
 const el=ev.target;
 if(el.id==='member-team-filter'){changeMemberTeam(el.value);return;}
 if(el.id==='history-platform'){historyFilters.platform=el.value;if(historyFilters.tool!=='all'&&el.value!=='all'&&tools[historyFilters.tool].platform!==el.value)historyFilters.tool='all';renderHistory();return;}
 if(el.id==='history-tool'){historyFilters.tool=el.value;renderHistory();return;}
 if(el.id==='history-period'){historyFilters.period=el.value;renderHistory();return;}
 if(el.id==='history-start'||el.id==='history-end'){historyFilters[el.id==='history-start'?'start':'end']=el.value;renderHistory();return;}
 if(el.id==='account-status-filter'){accountStatusFilter=el.value;renderAccounts();return;}
 if(el.id==='run-account'){configs[currentTool].accountId=el.value;configErrors=[];renderConfig();renderResult();return;}
 if(el.dataset.accountField&&accountDraft){accountDraft[el.dataset.accountField]=el.value;accountFormDirty=true;}
 if((el.id==='account-platform'||el.id==='account-service')&&accountDraft&&!accountDraft.id){
  scrubCredentialInputs();accountDraft.service=el.id==='account-platform'?Object.keys(services).find(s=>services[s].platform===el.value):el.value;
  accountDraft.credentialConfigured=false;accountDraft.loginDemoDone=false;accountDraft.credsTouched=true;accountFormDirty=true;renderAccountEditor();return;
 }
 if(el.name==='login-route'&&accountDraft){scrubCredentialInputs();accountDraft.loginMode=el.value;accountDraft.loginDemoDone=false;accountDraft.credsTouched=false;accountFormDirty=true;$('#credential-area').innerHTML=credentialMarkup();$('#account-errors')?.classList.add('hidden');return;}
 if(el.id==='credential-file'){const file=el.files[0];el.value='';importCredentialFile(file);return;}
 if(el.id==='cookie-format'){if($('#demo-cookie'))$('#demo-cookie').value='';accountFormDirty=true;}
 if(el.dataset.bindAccount&&bindingDraft){const set=new Set(bindingDraft.accounts);if(el.checked)set.add(el.dataset.bindAccount);else set.delete(el.dataset.bindAccount);bindingDraft.accounts=[...set];updateBindingDialog();}
});
$('#account-drawer').addEventListener('cancel',ev=>{ev.preventDefault();closeAccountEditor();});
$('#account-drawer').addEventListener('click',ev=>{
 if(ev.target!==$('#account-drawer'))return;const rect=ev.target.getBoundingClientRect();
 if(ev.clientX<rect.left||ev.clientX>rect.right||ev.clientY<rect.top||ev.clientY>rect.bottom)closeAccountEditor();
});

render();
</script>
</body></html>
